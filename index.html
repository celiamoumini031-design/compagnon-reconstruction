:root{--ivoire:#FAF8F4;--chaud:#EFEDE8;--pale:#F7E6C8;--pierre:#B9B5AD;--amb:#A85F00;--bright:#F0B24A;--ink:#23272B;--slate:#55595E;--dark:#1F2327}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ivoire);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:16px;line-height:1.45}
h1,h2,h3,.brand{font-family:'Montserrat',system-ui,sans-serif;font-weight:800;letter-spacing:-.01em;margin:0}
button,input,select{font:inherit;color:inherit}
#app{max-width:720px;margin:0 auto;padding:0 16px 110px}
.hero{background:var(--dark);color:#fff;margin:0 -16px 18px;padding:34px 22px 28px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-46px;top:-46px;width:128px;height:128px;border-radius:50%;background:#D98E04;opacity:.95}
.hero small{display:block;letter-spacing:.2em;font-size:11px;font-weight:600;color:var(--bright);text-transform:uppercase;margin-bottom:10px;position:relative;z-index:1}
.hero h1{font-size:32px;line-height:1.1;position:relative;z-index:1;max-width:calc(100% - 70px)}
.hero p{margin:10px 0 0;color:#d9d7d2;max-width:30ch;position:relative;z-index:1}
.page-title{font-size:26px;margin:6px 0 4px}
.sub{color:var(--slate);margin:0 0 16px;font-size:14px}
.card{background:var(--chaud);border-radius:14px;padding:16px;margin:0 0 14px}
.card.amb{background:var(--pale)}
.card.dark{background:var(--dark);color:#fff}
.lab{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--amb);margin:18px 0 8px}
.card .lab:first-child{margin-top:0}
.row{display:grid;gap:8px;align-items:center;margin:0 0 8px}
.r2{grid-template-columns:1fr 112px 36px}
.r3{grid-template-columns:minmax(0,1fr) 74px 74px 32px}
.rd{grid-template-columns:minmax(0,1fr) 74px 74px 32px}
.row.head{font-size:11px;font-weight:600;color:var(--slate);margin-bottom:4px}
input,select{width:100%;min-width:0;border:1.5px solid var(--pierre);background:#fff;border-radius:10px;padding:10px 11px;min-height:44px;outline:none}
input:focus,select:focus{border-color:var(--amb);box-shadow:0 0 0 3px #f0b24a55}
input[type=checkbox]{width:26px;height:26px;min-height:0;accent-color:#A85F00}
.x{border:0;background:transparent;color:var(--slate);font-size:22px;min-height:44px;cursor:pointer;border-radius:8px}
.x:hover{background:#0001}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;min-height:46px;font-weight:600;cursor:pointer;background:var(--ink);color:#fff}
.btn.amb{background:#F0B24A;color:var(--ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
.btn.small{min-height:40px;padding:8px 14px;font-size:14px}
.big{font-family:'Montserrat';font-weight:800;font-size:30px;letter-spacing:-.02em}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 14px}
.kpi{background:var(--chaud);border-radius:14px;padding:14px}
.kpi.hi{background:#F0B24A}
.kpi b{display:block;font-family:'Montserrat';font-size:22px;font-weight:800;line-height:1.15}
.kpi span{font-size:12px;color:var(--slate)}
.kpi.hi span{color:var(--ink)}
.neg{color:#B3261E}
.note{font-size:13px;color:var(--slate)}
.msg{font-weight:600;color:var(--amb);margin:6px 0 0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--dark);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav .in{display:flex;max-width:720px;width:100%}
nav button{flex:1;border:0;background:transparent;color:#bdbab4;padding:8px 2px;font-size:11px;font-weight:600;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--bright)}
.bar{height:10px;border-radius:6px;background:#F0B24A;min-width:2px}
.barrow{display:grid;grid-template-columns:120px 1fr 80px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.barrow span:last-child{text-align:right;font-weight:600}
.grid90{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.day{aspect-ratio:1;border-radius:50%;border:1.5px solid var(--pierre);background:#fff;font-size:11px;font-weight:600;color:var(--slate);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
.day.s1{background:#23272B;color:#fff;border-color:#23272B}.day.s2{background:#B9B5AD;color:#23272B}.day.s3{background:#EFEDE8;color:#23272B}.day.s4{background:#F7E6C8;color:#23272B;border-color:#e3c98f}.day.s5{background:#F0B24A;color:#23272B;border-color:#F0B24A}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--slate);margin:8px 0 14px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:1px solid #0002}
.sheet{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet .box{background:var(--ivoire);width:100%;max-width:720px;border-radius:20px 20px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom))}
.scores{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}
.scores button{border:2px solid transparent;border-radius:14px;min-height:56px;font-weight:800;font-family:'Montserrat';font-size:20px;cursor:pointer}
.phase{border-radius:14px;padding:16px;margin:0 0 14px}
.act{display:grid;grid-template-columns:26px minmax(0,1fr) 150px;gap:8px;align-items:center;margin:0 0 8px}
.donebar{height:8px;background:#0001;border-radius:6px;overflow:hidden;margin-top:8px}
.donebar i{display:block;height:100%;background:#A85F00;transition:width .3s}
.disc{font-size:12px;color:var(--slate);margin-top:22px}
.hidden{display:none}
@media (max-width:420px){.r3{grid-template-columns:minmax(0,1fr) 66px 66px 30px}.r2{grid-template-columns:minmax(0,1fr) 92px 30px}.act{grid-template-columns:26px minmax(0,1fr) 142px}.barrow{grid-template-columns:96px 1fr 72px}}
@media print{nav,.noprint,.x,.btn{display:none!important}body{background:#fff}#app{padding:0;max-width:none}.hero{margin:0 0 12px}.card,.phase{break-inside:avoid}input{border:0;border-bottom:1px solid #999;border-radius:0;padding:4px 0;background:transparent}.hero:after{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<nav class="noprint"><div class="in" id="nav"></div></nav>
<div id="modal"></div>
<script>
(function(){
"use strict";
var KEY='maison-zenith-reconstruction-v1';
var mem=null;
function load(){try{var s=localStorage.getItem(KEY);if(s)return JSON.parse(s);}catch(e){}return mem?JSON.parse(mem):null;}
function save(){var s=JSON.stringify(S);try{localStorage.setItem(KEY,s);}catch(e){mem=s;}}
function rows(labels,keys){return labels.map(function(l){var o={l:l};keys.forEach(function(k){o[k]='';});return o;});}
function defaults(){
 return {
  name:'',
  revenus:rows(['Salaire / activité','Aides, allocations',''],['a']),
  fixes:rows(['Logement','Assurances','Téléphone, internet','Transport','Énergie','Abonnements','Crédits, dettes','Impôts'],['p','r']),
  vars:rows(['Courses et repas','Santé','Plaisirs et sorties','Imprévus','Autre'],['p','r']),
  epargne:{p:'',r:''},
  depenses:[],
  cash:{pm:''},
  dettes:rows(['','',''],['m','pm']),
  humeur:{start:'',days:{}},
  route:{first:'',phases:[{obj:'',acts:[{t:'',d:'',ok:false},{t:'',d:'',ok:false},{t:'',d:'',ok:false}]},{obj:'',acts:[{t:'',d:'',ok:false},{t:'',d:'',ok:false},{t:'',d:'',ok:false}]},{obj:'',acts:[{t:'',d:'',ok:false},{t:'',d:'',ok:false},{t:'',d:'',ok:false}]}]}
 };
}
var S=load()||defaults();
var CATS=['Logement','Courses et repas','Transport','Santé','Plaisirs et sorties','Imprévus','Autre'];
var VIEW='home';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function n(v){var x=parseFloat(String(v).replace(/\s/g,'').replace(',','.'));return isFinite(x)?x:0;}
var FMT=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:2});
function eur(x){return FMT.format(x);}
function sum(a,k){return a.reduce(function(t,o){return t+n(o[k]);},0);}
function C(){
 var c={};
 c.rev=sum(S.revenus,'a'); c.fixP=sum(S.fixes,'p'); c.fixR=sum(S.fixes,'r'); c.varP=sum(S.vars,'p'); c.varR=sum(S.vars,'r');
 c.ep=n(S.epargne.r);
 c.soldeFixes=c.rev-c.fixR; c.reste=c.rev-c.fixR-c.varR-c.ep;
 c.dep=c.fixR+c.varR; c.objectif=c.dep/4; c.pm=n(S.cash.pm);
 c.moisRes=(c.pm>0&&c.objectif>0)?Math.ceil(c.objectif/c.pm):null;
 c.dettes=sum(S.dettes,'m'); c.dettesPm=sum(S.dettes,'pm'); c.moisDettes=(c.dettesPm>0&&c.dettes>0)?Math.ceil(c.dettes/c.dettesPm):null;
 c.depTotal=S.depenses.reduce(function(t,d){return t+n(d.m);},0);
 var vals=[];for(var i=1;i<=90;i++){var d=S.humeur.days[i];if(d&&d.s)vals.push(d.s);}
 c.noted=vals.length; c.avg=vals.length?vals.reduce(function(a,b){return a+b;},0)/vals.length:null;
 var acts=0,done=0;S.route.phases.forEach(function(p){p.acts.forEach(function(a){if(a.t){acts++;if(a.ok)done++;}});});c.acts=acts;c.done=done;
 return c;
}
function monthAvg(m){var v=[];for(var i=m*30+1;i<=m*30+30;i++){var d=S.humeur.days[i];if(d&&d.s)v.push(d.s);}return v.length?v.reduce(function(a,b){return a+b;},0)/v.length:null;}
var ICON={
 home:'<svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',
 budget:'<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><path d="M7 15h3"/></svg>',
 dep:'<svg viewBox="0 0 24 24"><path d="M5 4h14v16l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 9h6M9 13h6"/></svg>',
 cash:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5c0-1 1-1.7 2.5-1.7s2.5.7 2.5 1.7-1 1.5-2.5 1.8-2.5.8-2.5 1.8 1 1.7 2.5 1.7 2.5-.7 2.5-1.7"/></svg>',
 mood:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 14c1 1.5 2.3 2 4 2s3-.5 4-2"/><circle cx="9" cy="10" r=".6"/><circle cx="15" cy="10" r=".6"/></svg>',
 route:'<svg viewBox="0 0 24 24"><path d="M4 20V5"/><path d="M4 5h12l-2 4 2 4H4"/></svg>'
};
var TABS=[['home','Accueil'],['budget','Budget'],['dep','Dépenses'],['cash','Plan Cash'],['mood','Humeur'],['route','Route']];
function nav(){document.getElementById('nav').innerHTML=TABS.map(function(t){return '<button data-go="'+t[0]+'" class="'+(VIEW===t[0]?'on':'')+'" aria-label="'+t[1]+'">'+ICON[t[0]]+'<span>'+t[1]+'</span></button>';}).join('');}
function inp(path,val,ph,type,extra){return '<input data-p="'+path+'" value="'+esc(val)+'" '+(ph?'placeholder="'+esc(ph)+'" ':'')+(type==='num'?'inputmode="decimal" autocomplete="off" ':'')+(type==='date'?'type="date" ':'')+(extra||'')+'>';}
function xbtn(arr,i){return '<button class="x" data-del="'+arr+':'+i+'" aria-label="Supprimer">×</button>';}
function bind(id,fmt){return '<span data-c="'+id+'"></span>';}
function hero(small,title,p){return '<div class="hero"><small>'+small+'</small><h1>'+title+'</h1>'+(p?'<p>'+p+'</p>':'')+'</div>';}

function vHome(){
 return hero('Maison Zénith · Le compagnon','Reconstruction','Reprends la main en 90 jours. Une action à la fois.')+
 '<div class="kpis">'+
 '<div class="kpi hi"><b data-c="reste"></b><span>Reste à vivre du mois</span></div>'+
 '<div class="kpi"><b data-c="objectif"></b><span>Ma première réserve (objectif)</span></div>'+
 '<div class="kpi"><b data-c="avg"></b><span>Humeur moyenne (sur 5)</span></div>'+
 '<div class="kpi"><b data-c="actsDone"></b><span>Actions faites sur 90 jours</span></div></div>'+
 '<div class="card amb"><div class="lab">Mon prénom</div>'+inp('name',S.name,'Ton prénom')+
 '<p class="note" style="margin:10px 0 0" data-c="hello"></p></div>'+
 '<div class="lab">Par où commencer ?</div>'+
 '<div class="card"><b>1 · Mon budget</b><p class="note" style="margin:4px 0 10px">Tes revenus, tes charges, ton reste à vivre.</p><button class="btn small" data-go="budget">Ouvrir le budget</button></div>'+
 '<div class="card"><b>2 · Mon plan Cash</b><p class="note" style="margin:4px 0 10px">Ta première réserve et tes dettes classées.</p><button class="btn small" data-go="cash">Ouvrir le plan</button></div>'+
 '<div class="card"><b>3 · Ma feuille de route 90 jours</b><p class="note" style="margin:4px 0 10px">Trois objectifs, trois actions chacun. Imprimable.</p><button class="btn small amb" data-go="route">Ouvrir la route</button></div>'+
 '<div class="lab">Mes données</div>'+
 '<div class="card"><p class="note" style="margin-top:0">Tout reste sur cet appareil, dans ce navigateur. Copie ta sauvegarde de temps en temps et garde-la dans une note ou un mail à toi-même : c\'est ton filet de sécurité.</p>'+
 '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn small" data-act="export">Copier ma sauvegarde</button><button class="btn small ghost" data-act="import">Coller une sauvegarde</button><button class="btn small ghost" data-act="reset">Tout effacer</button></div>'+
 '</div>'+
 '<p class="disc">Ce compagnon accompagne ta période difficile. Il ne remplace ni un suivi médical, ni un soutien psychologique, ni un conseil juridique ou financier. En détresse : 3114, 24 h/24 (France). Usage personnel uniquement. © Maison Zénith.</p>';
}
function vBudget(){
 var h=hero('Mon budget du mois','Budget','Écris ce que tu sais. Les chiffres approximatifs suffisent pour commencer.');
 h+='<div class="kpis"><div class="kpi hi"><b data-c="reste"></b><span>Reste à vivre</span></div><div class="kpi"><b data-c="rev"></b><span>Revenus</span></div></div>';
 h+='<div class="lab">Ce qui rentre</div><div class="card">';
 S.revenus.forEach(function(r,i){h+='<div class="row r2">'+inp('revenus.'+i+'.l',r.l,'Source')+inp('revenus.'+i+'.a',r.a,'0 €','num')+xbtn('revenus',i)+'</div>';});
 h+='<button class="btn small ghost" data-add="revenus">+ Ajouter</button></div>';
 h+='<div class="lab">Mes charges fixes</div><div class="card"><div class="row r3 head"><span></span><span>Prévu</span><span>Réel</span><span></span></div>';
 S.fixes.forEach(function(r,i){h+='<div class="row r3">'+inp('fixes.'+i+'.l',r.l,'Charge')+inp('fixes.'+i+'.p',r.p,'0','num')+inp('fixes.'+i+'.r',r.r,'0','num')+xbtn('fixes',i)+'</div>';});
 h+='<button class="btn small ghost" data-add="fixes">+ Ajouter</button><p class="note" style="margin:12px 0 0">Total réel : <b data-c="fixR"></b> · Prévu : <b data-c="fixP"></b></p></div>';
 h+='<div class="lab">Mes dépenses variables</div><div class="card"><div class="row r3 head"><span></span><span>Prévu</span><span>Réel</span><span></span></div>';
 S.vars.forEach(function(r,i){h+='<div class="row r3">'+inp('vars.'+i+'.l',r.l,'Dépense')+inp('vars.'+i+'.p',r.p,'0','num')+inp('vars.'+i+'.r',r.r,'0','num')+xbtn('vars',i)+'</div>';});
 h+='<button class="btn small ghost" data-add="vars">+ Ajouter</button><p class="note" style="margin:12px 0 0">Total réel : <b data-c="varR"></b></p></div>';
 h+='<div class="lab">Ce que je mets de côté</div><div class="card"><div class="row r3 head"><span></span><span>Prévu</span><span>Réel</span><span></span></div><div class="row r3"><span>Épargne du mois</span>'+inp('epargne.p',S.epargne.p,'0','num')+inp('epargne.r',S.epargne.r,'0','num')+'<span></span></div></div>';
 h+='<div class="card dark"><div class="lab" style="color:#F0B24A">Mon bilan du mois</div><div class="barrow" style="color:#fff"><span>Revenus</span><span><div class="bar" data-bar="rev"></div></span><span data-c="rev"></span></div><div class="barrow" style="color:#fff"><span>Charges fixes</span><span><div class="bar" data-bar="fixR" style="background:#B9B5AD"></div></span><span data-c="fixR"></span></div><div class="barrow" style="color:#fff"><span>Variables</span><span><div class="bar" data-bar="varR" style="background:#B9B5AD"></div></span><span data-c="varR"></span></div><div class="barrow" style="color:#fff"><span>Épargne</span><span><div class="bar" data-bar="ep" style="background:#B9B5AD"></div></span><span data-c="ep"></span></div><p class="msg" data-c="msgReste" style="color:#F0B24A"></p></div>';
 return h;
}
function vDep(){
 var h=hero('Le suivi de mes dépenses','Dépenses','Note chaque dépense, même petite : ce qu\'on ne mesure pas, on ne le contrôle pas.');
 var today=new Date();var iso=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
 h+='<div class="card amb"><div class="lab">Nouvelle dépense</div><div class="row" style="grid-template-columns:1fr 1fr"><input id="nd" type="date" value="'+iso+'"><input id="nm" inputmode="decimal" placeholder="Montant (€)" autocomplete="off"></div><div class="row" style="grid-template-columns:1fr 1fr"><input id="nl" placeholder="Quoi ?"><select id="nc">'+CATS.map(function(c){return '<option>'+c+'</option>';}).join('')+'</select></div><button class="btn amb" data-act="adddep">+ Ajouter</button></div>';
 h+='<div class="lab">Par catégorie</div><div class="card" id="cats"></div>';
 h+='<div class="lab">Mes dépenses</div><div class="card">';
 if(!S.depenses.length)h+='<p class="note" style="margin:0">Rien pour l\'instant. Ajoute ta première dépense ci-dessus.</p>';
 S.depenses.slice().map(function(d,i){return {d:d,i:i};}).sort(function(a,b){return (b.d.dt||'').localeCompare(a.d.dt||'');}).forEach(function(o){var d=o.d;h+='<div class="row" style="grid-template-columns:70px 1fr 78px 36px;font-size:14px"><span class="note">'+esc((d.dt||'').slice(8,10)+'/'+(d.dt||'').slice(5,7))+'</span><span>'+esc(d.l||'—')+'<br><span class="note">'+esc(d.c)+'</span></span><b style="text-align:right">'+eur(n(d.m))+'</b>'+xbtn('depenses',o.i)+'</div>';});
 h+='<p style="margin:12px 0 0"><b>Total : </b><b data-c="depTotal"></b></p></div>';
 return h;
}
function vCash(){
 var h=hero('Mon plan Cash en 3 étapes','Plan Cash','Dans l\'ordre. Chaque étape prend dix minutes.');
 h+='<div class="card"><div class="lab">1 · Combien me faut-il de côté ?</div><p style="margin:0 0 6px">Mes dépenses du mois (reprises du budget) : <b data-c="dep"></b></p><p style="margin:0">Ma première réserve (dépenses ÷ 4) : <span class="big" data-c="objectif"></span></p><p class="note" style="margin:8px 0 0">Exemple : 1 200 € de dépenses ÷ 4 = 300 € à mettre de côté d\'abord.</p></div>';
 h+='<div class="card amb"><div class="lab">2 · Combien puis-je mettre de côté chaque mois ?</div>'+inp('cash.pm',S.cash.pm,'Montant par mois (€)','num')+'<p style="margin:10px 0 0" data-c="moisRes"></p></div>';
 h+='<div class="card"><div class="lab">3 · Mes dettes, de la plus urgente à la moins urgente</div><div class="row r3 head"><span></span><span>Dû</span><span>Par mois</span><span></span></div>';
 S.dettes.forEach(function(r,i){h+='<div class="row r3">'+inp('dettes.'+i+'.l',r.l,'Ce que je dois')+inp('dettes.'+i+'.m',r.m,'0','num')+inp('dettes.'+i+'.pm',r.pm,'0','num')+xbtn('dettes',i)+'</div>';});
 h+='<button class="btn small ghost" data-add="dettes">+ Ajouter</button><p style="margin:12px 0 0">Total dû : <b data-c="dettes"></b> · <span data-c="moisDettes"></span></p><p class="note">Si une dette te dépasse : parles-en à ton créancier avant l\'échéance et demande un échéancier.</p></div>';
 return h;
}
function vMood(){
 var h=hero('Mon baromètre d\'état','Humeur','Chaque soir, un rond. Pour voir la tendance, pas pour te juger.');
 h+='<div class="card amb"><div class="lab">Mon premier jour</div>'+inp('humeur.start',S.humeur.start,'','date')+'</div>';
 h+='<div class="legend"><span><i style="background:#23272B"></i>1 très difficile</span><span><i style="background:#B9B5AD"></i>2</span><span><i style="background:#EFEDE8"></i>3 neutre</span><span><i style="background:#F7E6C8"></i>4</span><span><i style="background:#F0B24A"></i>5 très bien</span></div>';
 h+='<div class="grid90" id="g90"></div>';
 h+='<div class="lab">Ce que je constate</div><div class="card"><div class="barrow"><span>Jours 1 à 30</span><span><div class="bar" data-m="0"></div></span><span data-c="m0"></span></div><div class="barrow"><span>Jours 31 à 60</span><span><div class="bar" data-m="1"></div></span><span data-c="m1"></span></div><div class="barrow"><span>Jours 61 à 90</span><span><div class="bar" data-m="2"></div></span><span data-c="m2"></span></div><p class="note" style="margin:10px 0 0">Les jours gris ne cassent pas la tendance : c\'est elle qui compte. <span data-c="noted"></span></p></div>';
 return h;
}
function vRoute(){
 var h=hero('Mes 90 prochains jours','Ma feuille de route','Une action de moins de 15 minutes suffit. Si tu sautes un jour, tu reprends le lendemain.');
 h+='<div class="card"><div class="lab">Mes chiffres</div><div class="kpis" style="margin:0"><div class="kpi"><b data-c="reste"></b><span>Reste à vivre</span></div><div class="kpi"><b data-c="objectif"></b><span>Première réserve</span></div></div></div>';
 h+='<div class="card amb"><div class="lab">Ma première action, sous 24 h</div>'+inp('route.first',S.route.first,'Écris-la ici, concrète et petite')+'</div>';
 var names=['Jours 1 à 30 · Stabiliser','Jours 31 à 60 · Construire','Jours 61 à 90 · Avancer'],bgs=['#F7E6C8','#EFEDE8','#E4E1DA'];
 S.route.phases.forEach(function(p,i){
  h+='<div class="phase" style="background:'+bgs[i]+'"><div class="lab" style="margin-top:0">'+names[i]+'</div>'+inp('route.phases.'+i+'.obj',p.obj,'Mon objectif')+'<div style="height:10px"></div>';
  p.acts.forEach(function(a,j){h+='<div class="act"><input type="checkbox" data-p="route.phases.'+i+'.acts.'+j+'.ok" '+(a.ok?'checked':'')+' aria-label="Fait">'+inp('route.phases.'+i+'.acts.'+j+'.t',a.t,'Action '+(j+1))+inp('route.phases.'+i+'.acts.'+j+'.d',a.d,'','date')+'</div>';});
  h+='</div>';
 });
 h+='<div class="card dark"><b>Progression</b><div class="donebar"><i data-donebar></i></div><p class="note" style="color:#d9d7d2;margin:8px 0 0" data-c="actsDone"></p></div>';
 h+='<div class="noprint" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn amb" data-act="print">Imprimer / PDF</button></div>';
 return h;
}
var VIEWS={home:vHome,budget:vBudget,dep:vDep,cash:vCash,mood:vMood,route:vRoute};

function setPath(path,val){var p=path.split('.');var o=S;for(var i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=val;}
function arr(name){return S[name];}
function render(){
 nav();
 document.getElementById('app').innerHTML=VIEWS[VIEW]();
 if(VIEW==='mood')drawDays();
 refresh();
 window.scrollTo(0,0);
}
function drawDays(){
 var g=document.getElementById('g90');if(!g)return;var out='';
 for(var i=1;i<=90;i++){var d=S.humeur.days[i];var s=d&&d.s?' s'+d.s:'';out+='<button class="day'+s+'" data-day="'+i+'" aria-label="Jour '+i+'">'+i+'</button>';}
 g.innerHTML=out;
}
function drawCats(){
 var box=document.getElementById('cats');if(!box)return;
 var tot={};CATS.forEach(function(c){tot[c]=0;});S.depenses.forEach(function(d){tot[d.c]=(tot[d.c]||0)+n(d.m);});
 var mx=Math.max.apply(null,CATS.map(function(c){return tot[c];}).concat([1]));
 box.innerHTML=CATS.map(function(c){return '<div class="barrow"><span>'+c+'</span><span><div class="bar" style="width:'+Math.round(tot[c]/mx*100)+'%"></div></span><span>'+eur(tot[c])+'</span></div>';}).join('');
}
function refresh(){
 var c=C();
 var T={
  reste:eur(c.reste),rev:eur(c.rev),fixR:eur(c.fixR),fixP:eur(c.fixP),varR:eur(c.varR),ep:eur(c.ep),dep:eur(c.dep),objectif:eur(c.objectif),
  depTotal:eur(c.depTotal),dettes:eur(c.dettes),
  avg:c.avg==null?'–':c.avg.toFixed(1).replace('.',','),
  actsDone:c.acts?c.done+' / '+c.acts:'0 / 0',
  moisRes:c.moisRes?('En mettant '+eur(c.pm)+' par mois, tu atteins ta première réserve en environ '+c.moisRes+' mois.'):'Indique un montant pour voir en combien de mois tu y arrives.',
  moisDettes:c.moisDettes?('environ '+c.moisDettes+' mois pour tout solder'):'indique un montant par mois',
  hello:S.name?('Bonjour '+S.name+'. Un pas aujourd\'hui suffit.'):'Un pas aujourd\'hui suffit.',
  noted:c.noted?(c.noted+' jour'+(c.noted>1?'s':'')+' noté'+(c.noted>1?'s':'')+'.'):'',
  msgReste:c.rev===0?'Commence par saisir tes revenus.':(c.reste<0?'Solde négatif : ce n\'est pas une fatalité, c\'est un chiffre à corriger.':'Solde positif : continue, et protège-le.')
 };
 for(var i=0;i<3;i++){var a=monthAvg(i);T['m'+i]=a==null?'–':a.toFixed(1).replace('.',',');}
 document.querySelectorAll('[data-c]').forEach(function(el){var k=el.getAttribute('data-c');if(k in T){el.textContent=T[k];if(k==='reste')el.classList.toggle('neg',c.reste<0&&el.parentElement&&el.parentElement.className.indexOf('hi')<0);}});
 var mx=Math.max(c.rev,c.fixR,c.varR,c.ep,1);
 document.querySelectorAll('[data-bar]').forEach(function(el){var v=c[el.getAttribute('data-bar')]||0;el.style.width=Math.max(0,Math.round(v/mx*100))+'%';});
 document.querySelectorAll('[data-m]').forEach(function(el){var a=monthAvg(+el.getAttribute('data-m'));el.style.width=(a?Math.round(a/5*100):0)+'%';});
 var db=document.querySelector('[data-donebar]');if(db)db.style.width=(c.acts?Math.round(c.done/c.acts*100):0)+'%';
 drawCats();
}
function download(name,text){var b=new Blob([text],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);}
function showBackup(){document.getElementById('modal').innerHTML='<div class="sheet"><div class="box"><h3>Ma sauvegarde</h3><p class="note">Copie ce texte et garde-le dans une note ou un mail à toi-même. Pour retrouver tes données sur un autre appareil, tu le colleras dans « Coller une sauvegarde ».</p><textarea id="bk" readonly style="width:100%;height:150px;border:1.5px solid var(--pierre);border-radius:10px;padding:10px;font-size:12px">'+esc(JSON.stringify(S))+'</textarea><p class="msg" id="bkmsg"></p><div style="display:flex;gap:8px;margin-top:8px"><button class="btn amb" data-act="docopy">Copier</button><button class="btn ghost" data-act="closemodal">Fermer</button></div></div></div>';}
function showRestore(){document.getElementById('modal').innerHTML='<div class="sheet"><div class="box"><h3>Coller une sauvegarde</h3><p class="note">Colle ici le texte de ta sauvegarde. Attention : cela remplace les données de cet appareil.</p><textarea id="bk" placeholder="Colle ici" style="width:100%;height:150px;border:1.5px solid var(--pierre);border-radius:10px;padding:10px;font-size:12px"></textarea><p class="msg" id="bkmsg"></p><div style="display:flex;gap:8px;margin-top:8px"><button class="btn amb" data-act="dorestore">Restaurer</button><button class="btn ghost" data-act="closemodal">Annuler</button></div></div></div>';}
function showReset(){document.getElementById('modal').innerHTML='<div class="sheet"><div class="box"><h3>Tout effacer ?</h3><p class="note">Toutes tes données sur cet appareil seront supprimées. Pense à copier ta sauvegarde avant.</p><div style="display:flex;gap:8px;margin-top:8px"><button class="btn" data-act="doreset">Oui, tout effacer</button><button class="btn ghost" data-act="closemodal">Annuler</button></div></div></div>';}
function openDay(i){
 var d=S.humeur.days[i]||{};var dt='';if(S.humeur.start){var x=new Date(S.humeur.start+'T12:00:00');x.setDate(x.getDate()+i-1);dt=' · '+x.toLocaleDateString('fr-FR',{day:'numeric',month:'long'});}
 var cols=[['#23272B','#fff'],['#B9B5AD','#23272B'],['#EFEDE8','#23272B'],['#F7E6C8','#23272B'],['#F0B24A','#23272B']];
 document.getElementById('modal').innerHTML='<div class="sheet" data-close="1"><div class="box"><h3>Jour '+i+esc(dt)+'</h3><p class="note" style="margin:4px 0 0">Comment a été ta journée ?</p><div class="scores">'+cols.map(function(c,k){return '<button data-score="'+(k+1)+'" data-day="'+i+'" style="background:'+c[0]+';color:'+c[1]+';'+(d.s===k+1?'border-color:#A85F00':'')+'">'+(k+1)+'</button>';}).join('')+'</div><input id="word" placeholder="Un mot (facultatif)" value="'+esc(d.w||'')+'" data-wd="'+i+'"><div style="display:flex;gap:8px;margin-top:12px"><button class="btn" data-close="1" data-save="'+i+'">Enregistrer</button><button class="btn ghost" data-clear="'+i+'">Effacer ce jour</button></div></div></div>';
}
document.addEventListener('input',function(e){
 var t=e.target;
 if(t.getAttribute&&t.getAttribute('data-p')){setPath(t.getAttribute('data-p'),t.type==='checkbox'?t.checked:t.value);save();refresh();}
});
document.addEventListener('click',function(e){
 var t=e.target.closest('[data-go],[data-add],[data-del],[data-act],[data-day],[data-score],[data-clear],[data-close],[data-save]');if(!t)return;
 if(t.hasAttribute('data-score')){var di=+t.getAttribute('data-day');S.humeur.days[di]=S.humeur.days[di]||{};S.humeur.days[di].s=+t.getAttribute('data-score');var w=document.getElementById('word');if(w)S.humeur.days[di].w=w.value;save();document.getElementById('modal').innerHTML='';drawDays();refresh();return;}
 if(t.hasAttribute('data-clear')){delete S.humeur.days[+t.getAttribute('data-clear')];save();document.getElementById('modal').innerHTML='';drawDays();refresh();return;}
 if(t.hasAttribute('data-save')){var di2=+t.getAttribute('data-save');var w2=document.getElementById('word');if(w2){S.humeur.days[di2]=S.humeur.days[di2]||{};S.humeur.days[di2].w=w2.value;save();}document.getElementById('modal').innerHTML='';drawDays();refresh();return;}
 if(t.hasAttribute('data-close')){if(t.classList.contains('sheet')&&e.target!==t)return;document.getElementById('modal').innerHTML='';return;}
 if(t.hasAttribute('data-day')){openDay(+t.getAttribute('data-day'));return;}
 if(t.hasAttribute('data-go')){VIEW=t.getAttribute('data-go');render();return;}
 if(t.hasAttribute('data-add')){var k=t.getAttribute('data-add');var tpl={revenus:{l:'',a:''},fixes:{l:'',p:'',r:''},vars:{l:'',p:'',r:''},dettes:{l:'',m:'',pm:''}}[k];S[k].push(JSON.parse(JSON.stringify(tpl)));save();render();return;}
 if(t.hasAttribute('data-del')){var p=t.getAttribute('data-del').split(':');S[p[0]].splice(+p[1],1);save();render();return;}
 var a=t.getAttribute('data-act');
 if(a==='export'){showBackup();}
 if(a==='import'){showRestore();}
 if(a==='reset'){showReset();}
 if(a==='doreset'){S=defaults();save();document.getElementById('modal').innerHTML='';render();}
 if(a==='docopy'){var ta=document.getElementById('bk');ta.select();var ok=false;try{navigator.clipboard.writeText(ta.value).then(function(){document.getElementById('bkmsg').textContent='Copié. Colle-le dans une note ou un mail à toi-même.';},function(){document.getElementById('bkmsg').textContent='Sélectionne le texte et copie-le à la main.';});ok=true;}catch(err){}if(!ok){try{document.execCommand('copy');document.getElementById('bkmsg').textContent='Copié.';}catch(e2){document.getElementById('bkmsg').textContent='Sélectionne le texte et copie-le à la main.';}}}
 if(a==='dorestore'){var v=document.getElementById('bk').value.trim();try{var o=JSON.parse(v);if(o&&o.revenus&&o.humeur){S=o;save();document.getElementById('modal').innerHTML='';render();}else{document.getElementById('bkmsg').textContent='Ce texte n\'est pas une sauvegarde du compagnon.';}}catch(e3){document.getElementById('bkmsg').textContent='Texte illisible : colle la sauvegarde complète.';}}
 if(a==='closemodal'){document.getElementById('modal').innerHTML='';}
 if(a==='print'){window.print();}
 if(a==='adddep'){var m=document.getElementById('nm').value;if(!n(m)){document.getElementById('nm').focus();return;}S.depenses.push({dt:document.getElementById('nd').value,m:m,l:document.getElementById('nl').value,c:document.getElementById('nc').value});save();render();}
});
render();
})();
</script>
</body>
